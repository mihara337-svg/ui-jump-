async function loadUserListForDropdown() {

    try {
        const q = query(collection(db, "users"));
        const snapshot = await getDocs(q);

            selectEl.innerHTML = '<option value="">親に とうろく してもらってね</option>';
            return;

            opt.innerText = name;
            selectEl.appendChild(opt);
        });
    } catch (e) {

}

async function loadAdminUsers() {

// ==========================================
// ゲーム開始・チェック
// ==========================================
async function tryStartGame(nameInput, btnElement) {
    if (!nameInput) { alert('おなまえ を えらんでね！'); return; }

    const originalText = btnElement.innerText;
    btnElement.innerText = 'かくにん中...'; btnElement.disabled = true;

    try {
        const docRef = doc(db, 'users', nameInput);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
            alert('この おなまえ は とうろく されていません。');
            btnElement.innerText = originalText; btnElement.disabled = false; return;
        }

        let data = docSnap.data();
        const today = new Date().toLocaleDateString('ja-JP');

        if (data.lastDate !== today) {
            data.playedToday = 0; data.lastDate = today;
        }

        let isUnlimited = (data.unlimitedDate === today);

        if (!isUnlimited && data.playedToday >= data.playLimit) {
            alert(`きょうは ${data.playLimit}回 あそんだよ！\nきょうのぶんは おしまい！またあしたね！`);
            btnElement.innerText = originalText; btnElement.disabled = false;
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
            return;
        }

        await updateDoc(docRef, { playedToday: data.playedToday + 1, lastDate: today });
        data.playedToday += 1;
        
        currentUser = data;
        currentUser.id = nameInput;

        btnElement.innerText = originalText; btnElement.disabled = false;
        initGame();

    } catch (e) {
        console.error(e); alert('通信エラーがおきました。');
        btnElement.innerText = originalText; btnElement.disabled = false;
    }
}

function blendColor(c1, c2, ratio) {
    const hex2rgb = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
    const rgb1 = hex2rgb(c1); const rgb2 = hex2rgb(c2);
    const r = Math.floor(rgb1[0] * (1 - ratio) + rgb2[0] * ratio);
    const g = Math.floor(rgb1[1] * (1 - ratio) + rgb2[1] * ratio);
    const b = Math.floor(rgb1[2] * (1 - ratio) + rgb2[2] * ratio);
    return `rgb(${r},${g},${b})`;
}

function getStageColors(dist) {
    const stageLen = 200;
    const totalIdx = Math.floor(dist / stageLen);
    const idx = totalIdx % STAGES.length; const nextIdx = (idx + 1) % STAGES.length;
    const progress = (dist % stageLen) / stageLen;
    const blend = progress > 0.75 ? (progress - 0.75) * 4 : 0;
    return {
        top: blendColor(STAGES[idx].top, STAGES[nextIdx].top, blend), bottom: blendColor(STAGES[idx].bottom, STAGES[nextIdx].bottom, blend), ground: blendColor(STAGES[idx].ground, STAGES[nextIdx].ground, blend), stage: STAGES[idx], loopCount: Math.floor(totalIdx / STAGES.length) + 1, totalIdx: totalIdx
    };
}

function initGame() {

    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    
    lastTime = performance.now();
    requestAnimationFrame(update);
}

function jump() {
    if (gameState !== 'playing') return;
    if (player.jumpCount < 2) {
        player.vy = player.jumpPower; player.jumpCount++;
        const color = player.jumpCount === 2 ? '#ffd32a' : '#ffffff';
        for(let i=0; i<7; i++) particles.push({ x: player.x + player.width/2, y: player.y + player.height, vx: (Math.random()-0.5)*6, vy: Math.random()*4, life: 20, color: color, size: 4 });
    }
}

function drawUi(x, y, w, h, isJumping, frame) {
    ctx.save(); ctx.translate(x + w/2, y + h/2);
    if (player.invulnerable > 0 && Math.floor(frame / 4) % 2 === 0) ctx.globalAlpha = 0.5;

    if (player.hasShield) {
        ctx.save(); ctx.strokeStyle = `rgba(255, 105, 180, ${0.6 + Math.sin(frame*0.2)*0.3})`; ctx.fillStyle = `rgba(255, 182, 193, 0.25)`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, w/1.3, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    }

    if (customImg) {
        if(isJumping) ctx.rotate(-0.15);
        let footOffset = isJumping ? 0 : Math.sin(frame * 0.35) * 6;
        ctx.fillStyle = '#ff9966'; ctx.beginPath(); ctx.arc(-14, h/2 - 8 + footOffset, 8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(14, h/2 - 8 - footOffset, 8, 0, Math.PI*2); ctx.fill();
        ctx.drawImage(customImg, -w/2, -h/2, w, h); ctx.restore(); return;
    }

    if (isJumping) { ctx.rotate(-0.1); ctx.scale(0.95, 1.05); } else { ctx.scale(1 + Math.sin(frame*0.25)*0.03, 1 - Math.sin(frame*0.25)*0.03); }
    ctx.fillStyle = '#ff9933'; ctx.beginPath(); ctx.roundRect(-w/2.5, -h/4, w/1.25, h/1.5, 18); ctx.fill();
    let footOffset = isJumping ? 0 : Math.sin(frame * 0.4) * 6;
    ctx.beginPath(); ctx.roundRect(-w/3, h/3 - footOffset, 12, 18, 5); ctx.fill(); ctx.beginPath(); ctx.roundRect(w/3 - 12, h/3 + footOffset, 12, 18, 5); ctx.fill();
    let handOffset = isJumping ? -6 : Math.cos(frame * 0.4) * 5;
    ctx.beginPath(); ctx.roundRect(-w/2 - 4, handOffset, 12, 18, 6); ctx.fill(); ctx.beginPath(); ctx.roundRect(w/2 - 8, -handOffset, 12, 18, 6); ctx.fill();
    ctx.fillStyle = '#ffe6cc'; ctx.beginPath(); ctx.arc(0, -h/6, w/1.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(-w/2, -h/2, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); let tailSwing = isJumping ? 6 : Math.sin(frame * 0.3) * 5; ctx.ellipse(-w/1.8 + tailSwing, -h/4, 11, 24, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -h/6 - 4, w/1.8, Math.PI, Math.PI*2); const step = (w/0.9) / 8; for(let i = w/1.8; i >= -w/1.8; i -= step) { ctx.lineTo(i, -h/6 - 2); ctx.lineTo(i - step/2, -h/3.2); } ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-w/3.8, -h/10); ctx.lineTo(-w/8, -h/10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w/8, -h/10); ctx.lineTo(w/3.8, -h/10); ctx.stroke();
    ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(-w/3.3, 1, 6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/3.3, 1, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#990000'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-w/3.3 - 2, -1); ctx.lineTo(-w/3.3 - 2, 3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-w/3.3 + 2, -1); ctx.lineTo(-w/3.3 + 2, 3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w/3.3 - 2, -1); ctx.lineTo(w/3.3 - 2, 3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w/3.3 + 2, -1); ctx.lineTo(w/3.3 + 2, 3); ctx.stroke();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-7, 4); ctx.quadraticCurveTo(-3.5, 9, 0, 4); ctx.quadraticCurveTo(3.5, 9, 7, 4); ctx.stroke();
    ctx.restore();
}

function spawnEntities(groundY, stageIdx) {
    const rand = Math.random();
    if (score > 160 && rand < 0.28) {
        const isHigh = Math.random() < 0.45; const flyY = isHigh ? groundY - 105 : groundY - 48;
        obstacles.push({ x: cw + 20, y: flyY, baseY: flyY, width: 38, height: 28, type: stageIdx === 4 ? 'ufo' : 'bird', speedMod: 1.2 });
    } else if (score > 350 && rand < 0.55) {
        let h = 55 + Math.random() * 35;
        obstacles.push({ x: cw + 20, y: groundY - h, baseH: h, width: 32, height: h, type: 'moving', phase: Math.random() * Math.PI * 2, speedMod: 1.0 });
    } else {
        let maxH = Math.min(45 + score / 12, 115); let h = 35 + Math.random() * maxH;
        obstacles.push({ x: cw + 20, y: groundY - h, width: 30, height: h, type: 'normal', speedMod: 1.0 });
        if (h > 75 && Math.random() < 0.45) springs.push({ x: cw - 75, y: groundY - 14, width: 34, height: 14, bounced: false });
    }
    if (Math.random() < 0.45) {
        const isShield = !player.hasShield && Math.random() < 0.18;
        items.push({ x: cw + 100 + Math.random() * 80, y: groundY - 70 - Math.random() * 90, size: 16, type: isShield ? 'shield' : 'star' });
    }
}

function update(timestamp) {
    if (gameState !== 'playing') return;
    requestAnimationFrame(update);

    if (!timestamp) timestamp = performance.now();
    let elapsed = timestamp - lastTime;
    if (elapsed < fpsInterval) return;
    lastTime = timestamp - (elapsed % fpsInterval);

    ctx.clearRect(0, 0, cw, ch);
    frameCount++; score += speed / 60; speed = Math.min(3.5 + (score / 180), 9.5);
    if (player.invulnerable > 0) player.invulnerable--;

    const groundY = ch - 55; const env = getStageColors(score);

    if (env.totalIdx !== currentStageIndex) {
        currentStageIndex = env.totalIdx; const loopText = env.loopCount > 1 ? ` (${env.loopCount}周目!)` : '';
        stageBannerText = env.stage.name + loopText; stageBannerTimer = 130;
    }

    let grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, env.top); grad.addColorStop(1, env.bottom);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, cw, ch);

    if (env.stage.weather === 'rainbow') {
        const rColors = ['rgba(255,0,0,0.18)', 'rgba(255,165,0,0.18)', 'rgba(255,255,0,0.18)', 'rgba(0,128,0,0.18)', 'rgba(0,0,255,0.18)', 'rgba(128,0,128,0.18)'];
        rColors.forEach((col, idx) => { ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(cw/2, groundY + 100, Math.max(cw, ch)*0.6 - idx*12, Math.PI, Math.PI*2); ctx.stroke(); });
    }

    if (['night', 'meteor', 'space'].includes(env.stage.weather)) {
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => { s.a += 0.05; ctx.globalAlpha = 0.4 + Math.sin(s.a)*0.5; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });
        ctx.globalAlpha = 1.0;
        if (env.stage.weather === 'space') {
            ctx.fillStyle = 'rgba(255, 180, 100, 0.35)'; ctx.beginPath(); ctx.arc(cw - 90, 110, 35, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(255, 220, 180, 0.5)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(cw - 90, 110, 62, 14, -0.3, 0, Math.PI*2); ctx.stroke();
        }
    }

    if (env.stage.weather === 'meteor' && Math.random() < 0.04) bgParticles.push({ x: Math.random() * cw + 100, y: -10, vx: -11 - Math.random()*5, vy: 9 + Math.random()*5, life: 35, type: 'meteor' });
    else if (env.stage.weather === 'sakura' && Math.random() < 0.15) bgParticles.push({ x: cw + 10, y: Math.random() * (ch - 100), vx: -2.5 - Math.random()*2, vy: 1 + Math.random()*1.5, life: 220, type: 'sakura' });
    else if (env.stage.weather === 'snow' && Math.random() < 0.25) bgParticles.push({ x: Math.random() * cw, y: -10, vx: -1.5 - Math.random(), vy: 2 + Math.random()*2, life: 200, type: 'snow' });

    for (let i = bgParticles.length - 1; i >= 0; i--) {
        let bp = bgParticles[i]; bp.x += bp.vx; bp.y += bp.vy; bp.life--;
        if (bp.type === 'meteor') { ctx.strokeStyle = `rgba(255, 255, 200, ${bp.life/35})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bp.x, bp.y); ctx.lineTo(bp.x - bp.vx*2.5, bp.y - bp.vy*2.5); ctx.stroke(); } 
        else if (bp.type === 'sakura') { ctx.fillStyle = '#ffb7c5'; ctx.beginPath(); ctx.ellipse(bp.x, bp.y, 6, 3.5, frameCount*0.05, 0, Math.PI*2); ctx.fill(); } 
        else if (bp.type === 'snow') { ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.beginPath(); ctx.arc(bp.x, bp.y, 3.5, 0, Math.PI*2); ctx.fill(); }
        if (bp.life <= 0 || bp.y > groundY) bgParticles.splice(i, 1);
    }

    if (!['night', 'meteor', 'space'].includes(env.stage.weather)) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        clouds.forEach(c => {
            c.x -= c.speed; if(c.x < -c.s * 2.5) c.x = cw + c.s;
            ctx.beginPath(); ctx.arc(c.x, c.y, c.s, 0, Math.PI*2); ctx.arc(c.x + c.s*0.8, c.y - c.s*0.35, c.s*0.8, 0, Math.PI*2); ctx.arc(c.x + c.s*1.6, c.y, c.s*0.85, 0, Math.PI*2); ctx.fill();
        });
    }

    player.vy += player.gravity; player.y += player.vy;
    if (player.y + player.height > groundY) { player.y = groundY - player.height; player.vy = 0; player.jumpCount = 0; }
    if (player.y < 0) { player.y = 0; player.vy = 0; }

    ctx.fillStyle = env.ground; ctx.fillRect(0, groundY, cw, ch - groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(0, groundY, cw, 5);

    if (frameCount >= nextSpawnFrame) {
        spawnEntities(groundY, currentStageIndex % STAGES.length);
        let minGap = Math.max(48, 105 - Math.floor(score / 20)); nextSpawnFrame = frameCount + minGap + Math.floor(Math.random() * 35);
    }

    for (let i = springs.length - 1; i >= 0; i--) {
        let sp = springs[i]; sp.x -= speed;
        ctx.fillStyle = '#ffd32a'; ctx.beginPath(); ctx.roundRect(sp.x, sp.y, sp.width, sp.height, 4); ctx.fill();
        ctx.fillStyle = '#ff9f1a'; ctx.fillRect(sp.x + 6, sp.y + 5, sp.width - 12, sp.height - 5);
        if (!sp.bounced && player.x + player.width > sp.x && player.x < sp.x + sp.width && player.y + player.height >= sp.y - 6 && player.y + player.height <= sp.y + sp.height + 12 && player.vy >= 0) {
            sp.bounced = true; player.vy = player.jumpPower * 1.45; player.jumpCount = 1; 
            floatingTexts.push({ x: player.x, y: player.y, text: '大ジャンプ！', color: '#ffd32a', life: 40 });
            for(let j=0; j<10; j++) particles.push({ x: sp.x + sp.width/2, y: sp.y, vx: (Math.random()-0.5)*8, vy: -Math.random()*6, life: 25, color: '#ffd32a', size: 4 });
        }
        if (sp.x + sp.width < 0) springs.splice(i, 1);
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i]; it.x -= speed; let bobY = it.y + Math.sin(frameCount * 0.1 + i) * 6;
        ctx.save(); ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.type === 'shield' ? '🩷' : '⭐', it.x, bobY); ctx.restore();
        let dx = (player.x + player.width/2) - it.x, dy = (player.y + player.height/2) - bobY;
        if (Math.hypot(dx, dy) < player.width/2 + it.size) {
            if (it.type === 'shield') { player.hasShield = true; floatingTexts.push({ x: player.x, y: player.y, text: 'バリアGET!', color: '#ff6b81', life: 45 }); } 
            else { score += 25; floatingTexts.push({ x: player.x, y: player.y, text: '+25m!', color: '#ffd32a', life: 45 }); }
            for(let j=0; j<8; j++) particles.push({ x: it.x, y: bobY, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, life: 20, color: '#ffd32a', size: 4 });
            items.splice(i, 1); continue;
        }
        if (it.x + 30 < 0) items.splice(i, 1);
    }

    drawUi(player.x, player.y, player.width, player.height, player.y < groundY - player.height - 5, frameCount);

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i]; obs.x -= speed * (obs.speedMod || 1);
        if (obs.type === 'moving') { obs.height = obs.baseH + Math.sin(frameCount * 0.08 + obs.phase) * 24; obs.y = groundY - obs.height; } 
        else if (obs.type === 'bird' || obs.type === 'ufo') { obs.y = obs.baseY + Math.sin(frameCount * 0.12) * 8; }

        if (obs.type === 'bird') {
            ctx.fillStyle = '#2f3542'; ctx.beginPath(); ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2.2, 0, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; let wingY = Math.sin(frameCount * 0.35) * 9; ctx.beginPath(); ctx.moveTo(obs.x + 12, obs.y + obs.height/2); ctx.lineTo(obs.x + 22, obs.y + obs.height/2 - wingY); ctx.stroke();
            ctx.fillStyle = '#ffa502'; ctx.beginPath(); ctx.moveTo(obs.x, obs.y + obs.height/2); ctx.lineTo(obs.x - 8, obs.y + obs.height/2 + 3); ctx.lineTo(obs.x, obs.y + obs.height/2 + 6); ctx.fill();
        } else if (obs.type === 'ufo') {
            ctx.fillStyle = '#7bed9f'; ctx.beginPath(); ctx.arc(obs.x + obs.width/2, obs.y + 10, 11, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#a4b0be'; ctx.beginPath(); ctx.ellipse(obs.x + obs.width/2, obs.y + 14, obs.width/1.7, 7, 0, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = obs.type === 'moving' ? '#a55eea' : '#ff4757'; ctx.beginPath(); ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 6); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(obs.x + 8, obs.y + 14, 3.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(obs.x + 20, obs.y + 14, 3.5, 0, Math.PI*2); ctx.fill();
        }

        let hitboxPad = 14;
        if (player.invulnerable <= 0 && player.x + hitboxPad < obs.x + obs.width && player.x + player.width - hitboxPad > obs.x && player.y + hitboxPad < obs.y + obs.height && player.y + player.height - hitboxPad > obs.y) {
            if (player.hasShield) {
                player.hasShield = false; player.invulnerable = 50; player.vy = -7; floatingTexts.push({ x: player.x, y: player.y, text: 'バリア防御！', color: '#ff6b81', life: 45 });
                for(let j=0; j<14; j++) particles.push({ x: obs.x + obs.width/2, y: obs.y + obs.height/2, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 25, color: '#ff6b81', size: 5 });
                obstacles.splice(i, 1); continue;
            } else {
                gameOver(env.stage.name); return;
            }
        }
        if (obs.x + obs.width < -20) obstacles.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color || '#ffffff'; ctx.globalAlpha = Math.max(0, p.life / 25); ctx.beginPath(); ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i]; ft.y -= 1.2; ft.life--;
        ctx.save(); ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = ft.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.globalAlpha = Math.min(1, ft.life / 15);
        ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(12, 12, 210, 56, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.fillText(`${Math.floor(score)} m`, 26, 40);
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#ffd32a'; ctx.fillText(env.stage.name, 26, 58);
    if (player.hasShield) { ctx.font = '18px sans-serif'; ctx.fillText('🩷', 185, 42); }

    if (stageBannerTimer > 0) {
        stageBannerTimer--; ctx.save(); let alpha = Math.min(1, stageBannerTimer / 25); ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; ctx.beginPath(); ctx.roundRect(cw/2 - 130, 85, 260, 44, 22); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(stageBannerText, cw/2, 113); ctx.restore();
    }
}

// ==========================================
// ゲームオーバーとランキング更新
// ==========================================
async function gameOver(stageName) {
    gameState = 'gameover';
    const finalScore = Math.floor(score);
    const today = new Date().toLocaleDateString('ja-JP');
    
    document.getElementById('result-score').innerHTML = `${finalScore}<span class="text-lg">m</span>`;
    document.getElementById('reached-stage').innerText = `到達ステージ: ${stageName}`;
    document.getElementById('display-player-name').innerText = currentUser.id;
    
    // 残り回数表示
    let isUnlimited = (currentUser.unlimitedDate === today);
    let remStr = isUnlimited ? "無制限✨" : Math.max(0, currentUser.playLimit - currentUser.playedToday) + " 回";
    document.getElementById('display-remaining').innerText = remStr;

    let noticeEl = document.getElementById('record-notice');
    noticeEl.innerText = "";
    noticeEl.classList.add('hidden');

    // スコア自動更新判定
    let updates = {};
    let isOverallBest = (!currentUser.bestScore || finalScore > currentUser.bestScore);
    let isDailyBest = (currentUser.dailyDate !== today || !currentUser.dailyScore || finalScore > currentUser.dailyScore);

    if (isOverallBest) {
        updates.bestScore = finalScore;
        currentUser.bestScore = finalScore;
        noticeEl.innerText = "👑 総合 自己ベスト更新！！ 👑";
        noticeEl.classList.remove('hidden');
    } else if (isDailyBest) {
        noticeEl.innerText = "📅 今日の 最高記録！";
        noticeEl.classList.remove('hidden');
    }

    if (isDailyBest) {
        updates.dailyScore = finalScore;
        updates.dailyDate = today;
        currentUser.dailyScore = finalScore;
        currentUser.dailyDate = today;
    }

    // 更新があればFirebaseに保存
    if (Object.keys(updates).length > 0) {
        try {
            await updateDoc(doc(db, "users", currentUser.id), updates);
        } catch(e) { console.error("スコア保存エラー", e); }
    }

    document.getElementById('game-over-screen').classList.remove('hidden');
    
    // ダブルランキングの読み込み
    loadRankings();
}

async function loadRankings() {
    const listO = document.getElementById('overall-leaderboard');
    const listD = document.getElementById('daily-leaderboard');
    listO.innerHTML = '<li class="text-gray-500 text-center py-2">よみこみ中...</li>';
    listD.innerHTML = '<li class="text-gray-500 text-center py-2">よみこみ中...</li>';
    
    try {
        // 総合トップ5
        const qO = query(collection(db, "users"), orderBy("bestScore", "desc"), limit(5));
        // デイリー制作用に少し多めに取得
        const qD = query(collection(db, "users"), orderBy("dailyScore", "desc"), limit(20));

        const [snapO, snapD] = await Promise.all([getDocs(qO), getDocs(qD)]);
        
        // 総合描画
        listO.innerHTML = '';
        if (snapO.empty) { listO.innerHTML = '<li class="text-gray-500 text-center py-1">まだないよ</li>'; }
        let rankO = 1;
        snapO.forEach(dSnap => {
            const d = dSnap.data();
            if (d.bestScore > 0) {
                let rStr = rankO === 1 ? "👑 1" : rankO;
                listO.innerHTML += `<li class="flex justify-between border-b border-orange-100 pb-1"><span class="font-bold w-6">${rStr}</span><span class="truncate flex-1">${dSnap.id}</span><span class="font-black text-blue-600">${d.bestScore}m</span></li>`;
                rankO++;
            }
        });

        // デイリー描画
        const today = new Date().toLocaleDateString('ja-JP');
        listD.innerHTML = '';
        let rankD = 1;
        snapD.forEach(dSnap => {
            const d = dSnap.data();
            if (d.dailyDate === today && d.dailyScore > 0 && rankD <= 5) {
                let rStr = rankD === 1 ? "🥇 1" : rankD;
                listD.innerHTML += `<li class="flex justify-between border-b border-blue-100 pb-1"><span class="font-bold w-6">${rStr}</span><span class="truncate flex-1">${dSnap.id}</span><span class="font-black text-blue-600">${d.dailyScore}m</span></li>`;
                rankD++;
            }
        });
        if (rankD === 1) { listD.innerHTML = '<li class="text-gray-500 text-center py-1">きょうは まだないよ</li>'; }

    } catch (e) {
        console.error("ランキングエラー", e);
        listO.innerHTML = '<li class="text-red-500 text-center">エラー</li>';
        listD.innerHTML = '<li class="text-red-500 text-center">エラー</li>';
    }
}

document.getElementById('image-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => { const img = new Image(); img.onload = () => { customImg = img; }; img.src = event.target.result; };
        reader.readAsDataURL(file);
    }
});
