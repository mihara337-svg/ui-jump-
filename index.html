<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ういじゃんぷ - パワーアップ版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; background-color: #000; user-select: none; -webkit-user-select: none; }
        canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
<!-- UI要素 -->
<div id="ui-layer" class="flex items-center justify-center">
    <!-- タイトル画面 -->
    <div id="title-screen" class="bg-white/95 p-6 rounded-2xl shadow-2xl text-center pointer-events-auto max-w-sm w-[90%] border-4 border-orange-400">
        <h1 class="text-3xl font-black text-orange-500 mb-2 tracking-wider">ういじゃんぷ</h1>
        <p class="text-xs text-orange-700 font-bold bg-orange-100 rounded-full py-1 px-3 inline-block mb-3">✨ 8つの世界＆ギミック追加版 ✨</p>
        <div class="text-xs text-gray-600 mb-5 text-left bg-gray-50 p-3 rounded-lg space-y-1">
            <p>👆 <b>画面タップ：</b>ジャンプ（空中で2段ジャンプ！）</p>
            <p>⭐ <b>スター：</b>距離 +25m ボーナス！</p>
            <p>🩷 <b>ハート：</b>1回だけ障害物をバリア！</p>
            <p>🟨 <b>バネ：</b>踏むと大ジャンプ！</p>
        </div>
        <button id="start-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-full text-xl shadow-lg active:scale-95 transition-transform">スタート！</button>
        <div class="mt-4 text-xs text-gray-500 border-t pt-3">
            <label class="block mb-1 font-medium">📷 お手元の写真を使う場合はこちら</label>
            <input type="file" id="image-upload" accept="image/*" class="w-full text-xs">
        </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="game-over-screen" class="hidden bg-white/95 p-6 rounded-2xl shadow-2xl text-center pointer-events-auto max-w-sm w-[90%] max-h-[90vh] overflow-y-auto hide-scroll border-4 border-red-400">
        <h2 class="text-2xl font-black text-red-500 mb-1">ゲームオーバー</h2>
        <p class="text-xs text-gray-500 mb-1" id="reached-stage">到達ステージ: さわやか青空</p>
        <p class="text-4xl font-black text-orange-500 mb-4" id="result-score">0<span class="text-lg">m</span></p>
        
        <div class="bg-gray-100 p-3 rounded-lg mb-4">
            <input type="text" id="player-name" placeholder="なまえを入力" class="w-full px-3 py-2 border rounded mb-2 text-center font-bold" maxlength="10">
            <button id="save-score-btn" class="w-full bg-blue-500 text-white font-bold py-2 rounded shadow active:scale-95 transition-transform">ランキングに登録</button>
        </div>

        <div class="text-left mb-4">
            <h3 class="font-bold border-b pb-1 mb-2 text-gray-700 text-sm">🏆 世界ランキング (Top 10)</h3>
            <ul id="leaderboard-list" class="space-y-1 text-sm h-40 overflow-y-auto hide-scroll">
                <li class="text-center text-gray-500 py-4">よみこみ中...</li>
            </ul>
        </div>

        <button id="restart-btn" class="w-full bg-orange-500 text-white font-bold py-3 rounded-full text-lg shadow active:scale-95 transition-transform">もう一度あそぶ</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

// Firebase設定
const firebaseConfig = {
  apiKey: "AIzaSyCjexaJ7BxxQLyebCNZ6A3W1E22apRYiFU",
  authDomain: "uijump-71d08.firebaseapp.com",
  projectId: "uijump-71d08",
  storageBucket: "uijump-71d08.firebasestorage.app",
  messagingSenderId: "731671590590",
  appId: "1:731671590590:web:98d478b2262ffedc0fd0ef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw, ch;
function resize() {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
}
window.addEventListener('resize', resize);
resize();

// 8つのステージ定義（200mごとに変化し、1600mで2周目へループ）
const STAGES = [
    { name: '☀️ さわやか青空', top: '#4ca1af', bottom: '#c4e0e5', ground: '#3b7a57', weather: 'sunny' },
    { name: '🌇 あかね色の夕暮れ', top: '#ff7e5f', bottom: '#feb47b', ground: '#5c3c28', weather: 'sunset' },
    { name: '🌙 静かな夜空', top: '#141e30', bottom: '#243b55', ground: '#1a2634', weather: 'night' },
    { name: '🌠 キラキラ流星群', top: '#0f0c29', bottom: '#302b63', ground: '#24243e', weather: 'meteor' },
    { name: '🪐 無重力っぽい宇宙', top: '#000000', bottom: '#130f40', ground: '#4834d4', weather: 'space' },
    { name: '🌸 さくら舞う朝', top: '#ffafbd', bottom: '#ffc3a0', ground: '#6ab04c', weather: 'sakura' },
    { name: '❄️ 凍える雪原', top: '#83a4d4', bottom: '#b6fbff', ground: '#dff9fb', weather: 'snow' },
    { name: '🌈 奇跡のレインボー', top: '#a8ff78', bottom: '#78ffd6', ground: '#f9ca24', weather: 'rainbow' }
];

// ゲーム変数
let gameState = 'title';
let score = 0;
let speed = 3.5;
let frameCount = 0;
let currentStageIndex = 0;
let stageBannerTimer = 0;
let stageBannerText = '';
let nextSpawnFrame = 90;

let player = { 
    x: 50, y: ch / 2, width: 58, height: 58, 
    vy: 0, gravity: 0.58, jumpPower: -10.5, 
    jumpCount: 0, hasShield: false, invulnerable: 0 
};

let obstacles = [];
let items = [];
let springs = [];
let particles = [];
let bgParticles = [];
let clouds = [];
let stars = [];
let floatingTexts = [];
let customImg = null;

// 色ブレンド関数
function blendColor(c1, c2, ratio) {
    const hex2rgb = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
    const rgb1 = hex2rgb(c1);
    const rgb2 = hex2rgb(c2);
    const r = Math.floor(rgb1[0] * (1 - ratio) + rgb2[0] * ratio);
    const g = Math.floor(rgb1[1] * (1 - ratio) + rgb2[1] * ratio);
    const b = Math.floor(rgb1[2] * (1 - ratio) + rgb2[2] * ratio);
    return `rgb(${r},${g},${b})`;
}

function getStageColors(dist) {
    const stageLen = 200;
    const totalIdx = Math.floor(dist / stageLen);
    const idx = totalIdx % STAGES.length;
    const nextIdx = (idx + 1) % STAGES.length;
    const progress = (dist % stageLen) / stageLen;
    // ステージ終盤（残り25%）で次のステージの色へ滑らかに変化
    const blend = progress > 0.75 ? (progress - 0.75) * 4 : 0;

    return {
        top: blendColor(STAGES[idx].top, STAGES[nextIdx].top, blend),
        bottom: blendColor(STAGES[idx].bottom, STAGES[nextIdx].bottom, blend),
        ground: blendColor(STAGES[idx].ground, STAGES[nextIdx].ground, blend),
        stage: STAGES[idx],
        loopCount: Math.floor(totalIdx / STAGES.length) + 1,
        totalIdx: totalIdx
    };
}

// 初期化
function initGame() {
    player.y = ch - 120;
    player.vy = 0;
    player.jumpCount = 0;
    player.hasShield = false;
    player.invulnerable = 0;
    obstacles = [];
    items = [];
    springs = [];
    particles = [];
    bgParticles = [];
    floatingTexts = [];
    clouds = Array.from({length: 5}, () => ({x: Math.random()*cw, y: 40 + Math.random()*(ch/2.5), s: 25+Math.random()*35, speed: 0.4+Math.random()*0.6}));
    stars = Array.from({length: 35}, () => ({x: Math.random()*cw, y: Math.random()*(ch-100), r: 1+Math.random()*2, a: Math.random()*Math.PI}));
    
    score = 0;
    speed = 3.5;
    frameCount = 0;
    currentStageIndex = 0;
    nextSpawnFrame = 80;
    stageBannerText = STAGES[0].name;
    stageBannerTimer = 120;
    gameState = 'playing';
    
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    
    requestAnimationFrame(update);
}

// ジャンプ
function jump() {
    if (gameState !== 'playing') return;
    if (player.jumpCount < 2) {
        player.vy = player.jumpPower;
        player.jumpCount++;
        const color = player.jumpCount === 2 ? '#ffd32a' : '#ffffff';
        for(let i=0; i<7; i++) {
            particles.push({
                x: player.x + player.width/2,
                y: player.y + player.height,
                vx: (Math.random()-0.5)*6,
                vy: Math.random()*4,
                life: 20,
                color: color,
                size: 4
            });
        }
    }
}

document.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
canvas.addEventListener('mousedown', jump);

document.getElementById('start-btn').addEventListener('click', initGame);
document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('title-screen').classList.remove('hidden');
    gameState = 'title';
});

// うい描画
function drawUi(x, y, w, h, isJumping, frame) {
    ctx.save();
    ctx.translate(x + w/2, y + h/2);

    // ダメージ後の無敵点滅
    if (player.invulnerable > 0 && Math.floor(frame / 4) % 2 === 0) {
        ctx.globalAlpha = 0.5;
    }

    // ハートバリアのオーラ描画
    if (player.hasShield) {
        ctx.save();
        ctx.strokeStyle = `rgba(255, 105, 180, ${0.6 + Math.sin(frame*0.2)*0.3})`;
        ctx.fillStyle = `rgba(255, 182, 193, 0.25)`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, w/1.3, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    if (customImg) {
        if(isJumping) ctx.rotate(-0.15);
        let footOffset = isJumping ? 0 : Math.sin(frame * 0.35) * 6;
        ctx.fillStyle = '#ff9966';
        ctx.beginPath(); ctx.arc(-14, h/2 - 8 + footOffset, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, h/2 - 8 - footOffset, 8, 0, Math.PI*2); ctx.fill();
        ctx.drawImage(customImg, -w/2, -h/2, w, h);
        ctx.restore();
        return;
    }

    if (isJumping) {
        ctx.rotate(-0.1);
        ctx.scale(0.95, 1.05);
    } else {
        ctx.scale(1 + Math.sin(frame*0.25)*0.03, 1 - Math.sin(frame*0.25)*0.03);
    }

    // 胴体
    ctx.fillStyle = '#ff9933';
    ctx.beginPath(); ctx.roundRect(-w/2.5, -h/4, w/1.25, h/1.5, 18); ctx.fill();

    // 足パタパタ
    let footOffset = isJumping ? 0 : Math.sin(frame * 0.4) * 6;
    ctx.beginPath(); ctx.roundRect(-w/3, h/3 - footOffset, 12, 18, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(w/3 - 12, h/3 + footOffset, 12, 18, 5); ctx.fill();

    // 手パタパタ
    let handOffset = isJumping ? -6 : Math.cos(frame * 0.4) * 5;
    ctx.beginPath(); ctx.roundRect(-w/2 - 4, handOffset, 12, 18, 6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(w/2 - 8, -handOffset, 12, 18, 6); ctx.fill();

    // 顔
    ctx.fillStyle = '#ffe6cc';
    ctx.beginPath(); ctx.arc(0, -h/6, w/1.8, 0, Math.PI*2); ctx.fill();

    // サイドテール＆黄色い髪留め
    ctx.fillStyle = '#ffcc00'; 
    ctx.beginPath(); ctx.arc(-w/2, -h/2, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; 
    ctx.beginPath();
    let tailSwing = isJumping ? 6 : Math.sin(frame * 0.3) * 5;
    ctx.ellipse(-w/1.8 + tailSwing, -h/4, 11, 24, -0.2, 0, Math.PI*2);
    ctx.fill();

    // ギザギザ前髪（チカチカしない固定波形）
    ctx.beginPath();
    ctx.arc(0, -h/6 - 4, w/1.8, Math.PI, Math.PI*2);
    const step = (w/0.9) / 8;
    for(let i = w/1.8; i >= -w/1.8; i -= step) {
        ctx.lineTo(i, -h/6 - 2);
        ctx.lineTo(i - step/2, -h/3.2);
    }
    ctx.closePath();
    ctx.fill();

    // 糸目
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-w/3.8, -h/10); ctx.lineTo(-w/8, -h/10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/8, -h/10); ctx.lineTo(w/3.8, -h/10); ctx.stroke();

    // 赤いほっぺ（縦線入り）
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(-w/3.3, 1, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w/3.3, 1, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#990000'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-w/3.3 - 2, -1); ctx.lineTo(-w/3.3 - 2, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w/3.3 + 2, -1); ctx.lineTo(-w/3.3 + 2, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/3.3 - 2, -1); ctx.lineTo(w/3.3 - 2, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/3.3 + 2, -1); ctx.lineTo(w/3.3 + 2, 3); ctx.stroke();

    // 「ω」のお口
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-7, 4);
    ctx.quadraticCurveTo(-3.5, 9, 0, 4);
    ctx.quadraticCurveTo(3.5, 9, 7, 4);
    ctx.stroke();

    ctx.restore();
}

// 障害物やギミックの生成
function spawnEntities(groundY, stageIdx) {
    const rand = Math.random();

    // 1. 空中を飛ぶ障害物（夕暮れステージ以降で解禁）
    if (score > 160 && rand < 0.28) {
        const isHigh = Math.random() < 0.45; // 高い位置なら歩いたままくぐれる！低い位置ならジャンプで飛び越える！
        const flyY = isHigh ? groundY - 105 : groundY - 48;
        obstacles.push({
            x: cw + 20, y: flyY, baseY: flyY,
            width: 38, height: 28,
            type: stageIdx === 4 ? 'ufo' : 'bird',
            speedMod: 1.2
        });
    } 
    // 2. 上下に伸縮するブロック（夜空ステージ以降で解禁）
    else if (score > 350 && rand < 0.55) {
        let h = 55 + Math.random() * 35;
        obstacles.push({
            x: cw + 20, y: groundY - h, baseH: h,
            width: 32, height: h,
            type: 'moving', phase: Math.random() * Math.PI * 2,
            speedMod: 1.0
        });
    } 
    // 3. 通常の地上ブロック
    else {
        let maxH = Math.min(45 + score / 12, 115);
        let h = 35 + Math.random() * maxH;
        obstacles.push({
            x: cw + 20, y: groundY - h,
            width: 30, height: h,
            type: 'normal',
            speedMod: 1.0
        });

        // 高いブロックの手前には時々「大ジャンプバネ」を配置して助ける
        if (h > 75 && Math.random() < 0.45) {
            springs.push({
                x: cw - 75, y: groundY - 14,
                width: 34, height: 14, bounced: false
            });
        }
    }

    // ボーナスアイテム（スター ★ / バリア ♥）の生成
    if (Math.random() < 0.45) {
        const isShield = !player.hasShield && Math.random() < 0.18;
        items.push({
            x: cw + 100 + Math.random() * 80,
            y: groundY - 70 - Math.random() * 90,
            size: 16,
            type: isShield ? 'shield' : 'star'
        });
    }
}

function update() {
    if (gameState !== 'playing') return;

    ctx.clearRect(0, 0, cw, ch);
    frameCount++;
    score += speed / 60; 
    // スピードは最初はゆっくり、上限を設けて無理ゲー化を防ぐ
    speed = Math.min(3.5 + (score / 180), 9.5);
    if (player.invulnerable > 0) player.invulnerable--;

    const groundY = ch - 55;
    const env = getStageColors(score);

    // ステージ切り替え演出
    if (env.totalIdx !== currentStageIndex) {
        currentStageIndex = env.totalIdx;
        const loopText = env.loopCount > 1 ? ` (${env.loopCount}周目!)` : '';
        stageBannerText = env.stage.name + loopText;
        stageBannerTimer = 130;
    }

    // 背景グラデーション描画
    let grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, env.top);
    grad.addColorStop(1, env.bottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    // 虹ステージの演出
    if (env.stage.weather === 'rainbow') {
        const rColors = ['rgba(255,0,0,0.18)', 'rgba(255,165,0,0.18)', 'rgba(255,255,0,0.18)', 'rgba(0,128,0,0.18)', 'rgba(0,0,255,0.18)', 'rgba(128,0,128,0.18)'];
        rColors.forEach((col, idx) => {
            ctx.strokeStyle = col;
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(cw/2, groundY + 100, Math.max(cw, ch)*0.6 - idx*12, Math.PI, Math.PI*2);
            ctx.stroke();
        });
    }

    // 星空（夜・流星・宇宙ステージ）
    if (['night', 'meteor', 'space'].includes(env.stage.weather)) {
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            s.a += 0.05;
            ctx.globalAlpha = 0.4 + Math.sin(s.a)*0.5;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // 宇宙ステージの惑星
        if (env.stage.weather === 'space') {
            ctx.fillStyle = 'rgba(255, 180, 100, 0.35)';
            ctx.beginPath(); ctx.arc(cw - 90, 110, 35, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(255, 220, 180, 0.5)';
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.ellipse(cw - 90, 110, 62, 14, -0.3, 0, Math.PI*2); ctx.stroke();
        }
    }

    // 天候パーティクル生成（流星・桜・雪）
    if (env.stage.weather === 'meteor' && Math.random() < 0.04) {
        bgParticles.push({ x: Math.random() * cw + 100, y: -10, vx: -11 - Math.random()*5, vy: 9 + Math.random()*5, life: 35, type: 'meteor' });
    } else if (env.stage.weather === 'sakura' && Math.random() < 0.15) {
        bgParticles.push({ x: cw + 10, y: Math.random() * (ch - 100), vx: -2.5 - Math.random()*2, vy: 1 + Math.random()*1.5, life: 220, type: 'sakura' });
    } else if (env.stage.weather === 'snow' && Math.random() < 0.25) {
        bgParticles.push({ x: Math.random() * cw, y: -10, vx: -1.5 - Math.random(), vy: 2 + Math.random()*2, life: 200, type: 'snow' });
    }

    // 天候パーティクル描画
    for (let i = bgParticles.length - 1; i >= 0; i--) {
        let bp = bgParticles[i];
        bp.x += bp.vx; bp.y += bp.vy; bp.life--;
        if (bp.type === 'meteor') {
            ctx.strokeStyle = `rgba(255, 255, 200, ${bp.life/35})`;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(bp.x, bp.y); ctx.lineTo(bp.x - bp.vx*2.5, bp.y - bp.vy*2.5); ctx.stroke();
        } else if (bp.type === 'sakura') {
            ctx.fillStyle = '#ffb7c5';
            ctx.beginPath(); ctx.ellipse(bp.x, bp.y, 6, 3.5, frameCount*0.05, 0, Math.PI*2); ctx.fill();
        } else if (bp.type === 'snow') {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath(); ctx.arc(bp.x, bp.y, 3.5, 0, Math.PI*2); ctx.fill();
        }
        if (bp.life <= 0 || bp.y > groundY) bgParticles.splice(i, 1);
    }

    // 雲の描画（宇宙・夜以外）
    if (!['night', 'meteor', 'space'].includes(env.stage.weather)) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        clouds.forEach(c => {
            c.x -= c.speed;
            if(c.x < -c.s * 2.5) c.x = cw + c.s;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.s, 0, Math.PI*2);
            ctx.arc(c.x + c.s*0.8, c.y - c.s*0.35, c.s*0.8, 0, Math.PI*2);
            ctx.arc(c.x + c.s*1.6, c.y, c.s*0.85, 0, Math.PI*2);
            ctx.fill();
        });
    }

    // ういの物理移動
    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y + player.height > groundY) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.jumpCount = 0;
    }
    if (player.y < 0) {
        player.y = 0;
        player.vy = 0;
    }

    // 地面の描画
    ctx.fillStyle = env.ground;
    ctx.fillRect(0, groundY, cw, ch - groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(0, groundY, cw, 5);

    // ギミック・障害物の出現管理
    if (frameCount >= nextSpawnFrame) {
        spawnEntities(groundY, currentStageIndex % STAGES.length);
        let minGap = Math.max(48, 105 - Math.floor(score / 20));
        nextSpawnFrame = frameCount + minGap + Math.floor(Math.random() * 35);
    }

    // 大ジャンプバネ（トランポリン）の更新と描画
    for (let i = springs.length - 1; i >= 0; i--) {
        let sp = springs[i];
        sp.x -= speed;

        ctx.fillStyle = '#ffd32a';
        ctx.beginPath(); ctx.roundRect(sp.x, sp.y, sp.width, sp.height, 4); ctx.fill();
        ctx.fillStyle = '#ff9f1a';
        ctx.fillRect(sp.x + 6, sp.y + 5, sp.width - 12, sp.height - 5);

        // バネを踏んだ判定
        if (!sp.bounced &&
            player.x + player.width > sp.x && player.x < sp.x + sp.width &&
            player.y + player.height >= sp.y - 6 && player.y + player.height <= sp.y + sp.height + 12 &&
            player.vy >= 0) {
            sp.bounced = true;
            player.vy = player.jumpPower * 1.45; // 大ジャンプ！
            player.jumpCount = 1; // 空中でもう1回ジャンプ可能
            floatingTexts.push({ x: player.x, y: player.y, text: '大ジャンプ！', color: '#ffd32a', life: 40 });
            for(let j=0; j<10; j++) {
                particles.push({ x: sp.x + sp.width/2, y: sp.y, vx: (Math.random()-0.5)*8, vy: -Math.random()*6, life: 25, color: '#ffd32a', size: 4 });
            }
        }
        if (sp.x + sp.width < 0) springs.splice(i, 1);
    }

    // ボーナスアイテム（★ / ♥）の更新と描画
    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.x -= speed;
        let bobY = it.y + Math.sin(frameCount * 0.1 + i) * 6;

        ctx.save();
        ctx.font = '26px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.type === 'shield' ? '🩷' : '⭐', it.x, bobY);
        ctx.restore();

        // 取得判定
        let dx = (player.x + player.width/2) - it.x;
        let dy = (player.y + player.height/2) - bobY;
        if (Math.hypot(dx, dy) < player.width/2 + it.size) {
            if (it.type === 'shield') {
                player.hasShield = true;
                floatingTexts.push({ x: player.x, y: player.y, text: 'バリアGET!', color: '#ff6b81', life: 45 });
            } else {
                score += 25;
                floatingTexts.push({ x: player.x, y: player.y, text: '+25m!', color: '#ffd32a', life: 45 });
            }
            for(let j=0; j<8; j++) {
                particles.push({ x: it.x, y: bobY, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, life: 20, color: '#ffd32a', size: 4 });
            }
            items.splice(i, 1);
            continue;
        }
        if (it.x + 30 < 0) items.splice(i, 1);
    }

    // ういの描画
    drawUi(player.x, player.y, player.width, player.height, player.y < groundY - player.height - 5, frameCount);

    // 障害物の更新と描画
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= speed * (obs.speedMod || 1);

        if (obs.type === 'moving') {
            obs.height = obs.baseH + Math.sin(frameCount * 0.08 + obs.phase) * 24;
            obs.y = groundY - obs.height;
        } else if (obs.type === 'bird' || obs.type === 'ufo') {
            obs.y = obs.baseY + Math.sin(frameCount * 0.12) * 8;
        }

        // 障害物の見た目描画
        if (obs.type === 'bird') {
            ctx.fillStyle = '#2f3542';
            ctx.beginPath(); ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2.2, 0, 0, Math.PI*2); ctx.fill();
            // 羽パタパタ
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
            let wingY = Math.sin(frameCount * 0.35) * 9;
            ctx.beginPath(); ctx.moveTo(obs.x + 12, obs.y + obs.height/2); ctx.lineTo(obs.x + 22, obs.y + obs.height/2 - wingY); ctx.stroke();
            // くちばし
            ctx.fillStyle = '#ffa502';
            ctx.beginPath(); ctx.moveTo(obs.x, obs.y + obs.height/2); ctx.lineTo(obs.x - 8, obs.y + obs.height/2 + 3); ctx.lineTo(obs.x, obs.y + obs.height/2 + 6); ctx.fill();
        } else if (obs.type === 'ufo') {
            ctx.fillStyle = '#7bed9f';
            ctx.beginPath(); ctx.arc(obs.x + obs.width/2, obs.y + 10, 11, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#a4b0be';
            ctx.beginPath(); ctx.ellipse(obs.x + obs.width/2, obs.y + 14, obs.width/1.7, 7, 0, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = obs.type === 'moving' ? '#a55eea' : '#ff4757';
            ctx.beginPath(); ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 6); ctx.fill();
            // ブロックのかわいい目
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(obs.x + 8, obs.y + 14, 3.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(obs.x + 20, obs.y + 14, 3.5, 0, Math.PI*2); ctx.fill();
        }

        // 当たり判定
        let hitboxPad = 14;
        if (player.invulnerable <= 0 &&
            player.x + hitboxPad < obs.x + obs.width &&
            player.x + player.width - hitboxPad > obs.x &&
            player.y + hitboxPad < obs.y + obs.height &&
            player.y + player.height - hitboxPad > obs.y) {
            
            if (player.hasShield) {
                // バリアで弾き飛ばす！
                player.hasShield = false;
                player.invulnerable = 50;
                player.vy = -7;
                floatingTexts.push({ x: player.x, y: player.y, text: 'バリア防御！', color: '#ff6b81', life: 45 });
                for(let j=0; j<14; j++) {
                    particles.push({ x: obs.x + obs.width/2, y: obs.y + obs.height/2, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 25, color: '#ff6b81', size: 5 });
                }
                obstacles.splice(i, 1);
                continue;
            } else {
                gameOver(env.stage.name);
                return;
            }
        }

        if (obs.x + obs.width < -20) obstacles.splice(i, 1);
    }

    // エフェクトパーティクルの描画
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color || '#ffffff';
        ctx.globalAlpha = Math.max(0, p.life / 25);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1.0;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // ポップアップ文字（+25m! など）の描画
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1.2;
        ft.life--;
        ctx.save();
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = ft.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.globalAlpha = Math.min(1, ft.life / 15);
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    // 左上のスコア＆ステージ表示UI
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(12, 12, 210, 56, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText(`${Math.floor(score)} m`, 26, 40);
    
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#ffd32a';
    ctx.fillText(env.stage.name, 26, 58);

    if (player.hasShield) {
        ctx.font = '18px sans-serif';
        ctx.fillText('🩷', 185, 42);
    }

    // ステージ突入バナー演出
    if (stageBannerTimer > 0) {
        stageBannerTimer--;
        ctx.save();
        let alpha = Math.min(1, stageBannerTimer / 25);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.beginPath(); ctx.roundRect(cw/2 - 130, 85, 260, 44, 22); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(stageBannerText, cw/2, 113);
        ctx.restore();
    }

    requestAnimationFrame(update);
}

function gameOver(stageName) {
    gameState = 'gameover';
    document.getElementById('result-score').innerHTML = `${Math.floor(score)}<span class="text-lg">m</span>`;
    document.getElementById('reached-stage').innerText = `到達ステージ: ${stageName}`;
    document.getElementById('game-over-screen').classList.remove('hidden');
    
    const saveBtn = document.getElementById('save-score-btn');
    saveBtn.innerText = 'ランキングに登録';
    saveBtn.disabled = false;
    saveBtn.classList.remove('bg-gray-400');
    saveBtn.classList.add('bg-blue-500');
    
    saveBtn.onclick = () => {
        const nameInput = document.getElementById('player-name').value.trim();
        const playerName = nameInput || '名無し';
        saveScoreToFirebase(playerName, score);
        
        saveBtn.innerText = '登録しました！';
        saveBtn.disabled = true;
        saveBtn.classList.remove('bg-blue-500');
        saveBtn.classList.add('bg-gray-400');
    };

    loadLeaderboardFromFirebase();
}

// Firebase ランキング連携
async function saveScoreToFirebase(name, finalScore) {
    try {
        await addDoc(collection(db, "scores"), {
            name: name,
            score: Math.floor(finalScore),
            timestamp: serverTimestamp()
        });
        loadLeaderboardFromFirebase();
    } catch (e) {
        console.error("エラー: ", e);
        alert("登録に失敗しました。");
    }
}

async function loadLeaderboardFromFirebase() {
    const listEl = document.getElementById('leaderboard-list');
    listEl.innerHTML = '<li class="text-center text-gray-500 py-4">よみこみ中...</li>';
    
    try {
        const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));
        const querySnapshot = await getDocs(q);
        
        listEl.innerHTML = '';
        let rank = 1;
        
        if (querySnapshot.empty) {
            listEl.innerHTML = '<li class="text-center text-gray-500 py-4">まだ記録がありません。<br>あなたが1位になるチャンス！</li>';
            return;
        }

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center bg-gray-50 p-2 rounded shadow-sm';
            
            let rankStr = rank + "位";
            if(rank === 1) rankStr = "👑 1位";
            else if(rank === 2) rankStr = "🥈 2位";
            else if(rank === 3) rankStr = "🥉 3位";
            
            const safeName = data.name.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));

            li.innerHTML = `
                <span class="font-bold w-14 text-left text-xs sm:text-sm text-gray-700">${rankStr}</span>
                <span class="truncate flex-1 mx-2 text-left text-sm font-medium">${safeName}</span>
                <span class="font-mono font-black text-blue-500 text-base">${data.score}m</span>
            `;
            listEl.appendChild(li);
            rank++;
        });
    } catch (e) {
        console.error("エラー: ", e);
        listEl.innerHTML = '<li class="text-center text-red-500 py-4">読み込みエラー</li>';
    }
}

document.getElementById('image-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => { customImg = img; };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
});

ctx.fillStyle = '#000';
ctx.fillRect(0, 0, cw, ch);
